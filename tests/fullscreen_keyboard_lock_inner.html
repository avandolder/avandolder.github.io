<!doctype html>
<button id="b1">enter fullscreen</button>
<button id="b2">enter fullscreen with keyboard lock</button>
<button id="b3" onclick="document.exitFullscreen();">exit fullscreen</button>
<script>
  document.addEventListener("keydown", async (e) => {
    if (e.key == "Escape") {
      e.preventDefault();
    }
  });
  b1.addEventListener("click", async () => {
    await document.documentElement.requestFullscreen();
  });
  b2.addEventListener("click", async () => {
    await document.documentElement.requestFullscreen({keyboardLock: "browser"});
  });
  b3.addEventListener("click", async () => {
    await document.exitFullscreen();
  });
</script>
